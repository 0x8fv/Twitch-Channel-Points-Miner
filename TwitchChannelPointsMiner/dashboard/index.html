<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Points Miner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 13h4V9h4V5h4' fill='none' stroke='%239146ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
// Theme is set before first paint so the page never flashes the wrong one.
(function () {
  var t = null;
  try { t = localStorage.getItem('tcpm.theme'); } catch (e) {}
  document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
})();
</script>
<style>
:root {
  color-scheme: light;
  --side: #f4f4f5; --page: #fafafa; --card: #ffffff; --raised: #e7e7e9; --hover: rgba(23,23,23,.045);
  --ink: #171717; --ink2: #525252; --muted: #6b6b6b;
  --hair: rgba(23,23,23,.09); --grid: rgba(23,23,23,.07);
  --line: #772ce8; --wash: rgba(119,44,232,.06);
  --up: #15803d; --down: #dc2626; --neu: #8a6a12; --online: #16a34a;
  --float: 0 8px 24px rgba(0,0,0,.08);
  --sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Liberation Mono", monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --side: #0f0f10; --page: #141415; --card: #19191b; --raised: #232325; --hover: rgba(237,237,237,.05);
  --ink: #ededed; --ink2: #a1a1a6; --muted: #85858b;
  --hair: rgba(237,237,237,.08); --grid: rgba(237,237,237,.06);
  --line: #a970ff; --wash: rgba(169,112,255,.07);
  --up: #4cc38a; --down: #e5484d; --neu: #e0b15a; --online: #4cc38a;
  --float: 0 8px 24px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/20px var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; transition: background-color .14s var(--ease), color .14s var(--ease); }
:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
h1, h2, dl, dd, ul { margin: 0; padding: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.lbl { font-size: 12px; line-height: 16px; color: var(--muted); }

.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100dvh; }

/* ---------- sidebar ---------- */
.side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--hair); }
.brand { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; flex: none; }
.brand svg { color: var(--line); flex: none; }
.brand h1 { font-size: 14px; font-weight: 500; }
.totals { padding: 8px 16px 20px; }
.totals .fig { margin-top: 4px; font-size: 24px; line-height: 32px; font-weight: 500; }
.totals dl { margin-top: 12px; }
.totals dl div { display: flex; justify-content: space-between; height: 20px; font-size: 12px; }
.totals dt { color: var(--muted); }
.filter { position: relative; margin: 0 12px; }
.filter input { width: 100%; height: 32px; padding: 0 32px 0 12px; border: 1px solid var(--hair); border-radius: 8px; background: var(--card); color: inherit; font: inherit; font-size: 13px; }
.filter input::placeholder { color: var(--muted); }
.filter input::-webkit-search-cancel-button { display: none; }
.filter kbd { position: absolute; right: 8px; top: 8px; width: 16px; height: 16px; border: 1px solid var(--hair); border-radius: 4px; color: var(--muted); font: 11px/14px var(--mono); text-align: center; pointer-events: none; }
.filter input:focus + kbd, .filter input:not(:placeholder-shown) + kbd { display: none; }
.sorts { display: flex; gap: 4px; padding: 12px 12px 8px; }
.sorts button { height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.sorts button:hover { color: var(--ink); }
.sorts button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
#list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; list-style: none; scrollbar-width: thin; }
#list li + li { margin-top: 2px; }
#list button { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border-radius: 8px; text-align: left; font-size: 13px; color: var(--muted); }
#list button.on { color: var(--ink2); }
#list button:hover { background: var(--hover); color: var(--ink); }
#list button[aria-current="true"] { background: var(--raised); color: var(--ink); }
#list .val { font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--muted); opacity: .5; }
.on > .dot, .dot.on { background: var(--online); border-color: var(--online); opacity: 1; }
.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 8px; font-size: 13px; color: var(--muted); }
.foot { display: flex; align-items: center; justify-content: space-between; flex: none; height: 40px; padding: 0 16px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--muted); }
.foot button:hover { color: var(--ink); }

/* ---------- detail ---------- */
.main { min-width: 0; overflow-y: auto; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px 48px; }
.bar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.bar a { color: var(--ink); text-decoration: none; font-weight: 500; }
.bar a[href]:hover { text-decoration: underline; text-underline-offset: 3px; }
#d-state { display: inline-flex; align-items: center; gap: 8px; margin-right: auto; font-size: 13px; color: var(--muted); }
.ranges { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--hair); border-radius: 8px; }
.ranges button { height: 24px; padding: 0 12px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.ranges button:hover { color: var(--ink); }
.ranges button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
.hero { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 24px 32px; padding: 16px 0 24px; }
#d-points { font-size: 40px; line-height: 44px; font-weight: 500; letter-spacing: -.02em; }
#d-delta { min-height: 20px; margin-top: 8px; font-size: 13px; color: var(--ink2); }
.stats { display: flex; margin-left: auto; }
.stats div { padding: 0 24px; border-left: 1px solid var(--hair); }
.stats div:last-child { padding-right: 0; }
.stats dd { margin-top: 4px; font-size: 16px; line-height: 24px; font-weight: 500; }
.card { padding: 20px 20px 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 12px; }
.plot { position: relative; height: 400px; transition: opacity .16s var(--ease); }
.plot.loading { opacity: .45; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov { touch-action: pan-y; }
#tip { position: absolute; left: 0; top: 0; z-index: 2; max-width: 336px; padding: 8px 12px; background: var(--card); border: 1px solid var(--hair); border-radius: 8px; box-shadow: var(--float); font-size: 12px; line-height: 16px; pointer-events: none; will-change: transform; }
#tip .v { font-size: 14px; line-height: 20px; font-weight: 500; }
#tip .t, #tip .more { color: var(--muted); }
#tip .more { margin-top: 8px; }
#tip .e { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hair); }
#tip .m { margin-top: 4px; color: var(--ink2); overflow-wrap: anywhere; }
.tag { display: inline-flex; align-items: center; gap: 8px; }
.tag svg { flex: none; }
.legend { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); font-size: 12px; line-height: 16px; }
.legend:empty { display: none; }
.lg { display: flex; flex-wrap: wrap; align-items: center; gap: 0 16px; }
.lg .k { flex: none; width: 64px; }
.legend button { display: inline-flex; align-items: center; gap: 8px; height: 24px; color: var(--ink2); }
.legend button:hover { color: var(--ink); }
.legend button[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }
.legend .num { color: var(--muted); }

/* ---------- activity ---------- */
.loghead { display: flex; align-items: baseline; justify-content: space-between; margin-top: 32px; }
.loghead h2 { font-size: 14px; font-weight: 500; }
#log { list-style: none; }
#log .day { padding: 16px 0 8px; font-size: 12px; line-height: 16px; color: var(--muted); }
#log .ev { display: grid; grid-template-columns: 72px 136px minmax(0, 1fr); align-items: start; gap: 16px; padding: 8px 0; border-top: 1px solid var(--hair); font-size: 13px; }
#log time { font-size: 12px; color: var(--muted); white-space: nowrap; }
#log .m { color: var(--ink2); overflow-wrap: anywhere; }
#more { height: 32px; margin-top: 12px; padding: 0 12px; border: 1px solid var(--hair); border-radius: 8px; font-size: 13px; color: var(--ink2); }
#more:hover { background: var(--hover); color: var(--ink); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; height: auto; }
  .main { order: -1; overflow: visible; }
  .wrap { padding: 0 16px 32px; }
  .side { border-right: 0; border-top: 1px solid var(--hair); }
  #list { overflow: visible; }
  #d-points { font-size: 32px; line-height: 36px; }
  .stats { margin-left: 0; width: 100%; }
  .stats div { flex: 1; padding: 0 12px; }
  .stats div:first-child { padding-left: 0; border-left: 0; }
  .card { padding: 16px 12px 12px; }
  .plot { height: 320px; }
  #log .ev { grid-template-columns: 72px minmax(0, 1fr); gap: 4px 12px; }
  #log .m { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Streamers">
    <div class="brand">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13h4V9h4V5h4"/></svg>
      <h1>Channel Points Miner</h1>
    </div>
    <div class="totals">
      <div class="lbl">Total balance</div>
      <div class="fig num" id="t-points">–</div>
      <dl>
        <div><dt>This session</dt><dd class="num" id="t-gain">–</dd></div>
        <div><dt>Online</dt><dd class="num" id="t-online">–</dd></div>
      </dl>
    </div>
    <div class="filter">
      <input id="q" type="search" placeholder="Filter" aria-label="Filter streamers" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div class="sorts" role="group" aria-label="Sort streamers">
      <button type="button" data-sort="points">Balance</button>
      <button type="button" data-sort="gain">Session</button>
      <button type="button" data-sort="name">Name</button>
    </div>
    <ul id="list"><li class="empty">Loading</li></ul>
    <div class="foot">
      <span id="status" class="num" role="status"></span>
      <button id="theme" type="button"></button>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="bar">
        <a id="d-name" target="_blank" rel="noopener">–</a>
        <span id="d-state"></span>
        <div class="ranges" role="group" aria-label="Date range">
          <button type="button" data-range="24h">24h</button>
          <button type="button" data-range="7d">7d</button>
          <button type="button" data-range="30d">30d</button>
          <button type="button" data-range="all">All</button>
        </div>
      </div>
      <div class="hero">
        <div>
          <div class="lbl">Balance</div>
          <div id="d-points" class="num">–</div>
          <div id="d-delta"></div>
        </div>
        <dl class="stats">
          <div><dt class="lbl" id="s-low-l">Low</dt><dd class="num" id="s-low">–</dd></div>
          <div><dt class="lbl" id="s-high-l">High</dt><dd class="num" id="s-high">–</dd></div>
          <div><dt class="lbl">This session</dt><dd class="num" id="s-session">–</dd></div>
        </dl>
      </div>
      <section class="card" aria-label="Balance over time">
        <div class="plot" id="plot">
          <canvas id="cv" role="img" aria-label="Channel points over time"></canvas>
          <canvas id="ov" aria-hidden="true"></canvas>
          <div id="tip" role="tooltip" hidden></div>
        </div>
        <div class="legend" id="legend" aria-label="Event types, click to show or hide"></div>
      </section>
      <section aria-labelledby="log-h">
        <div class="loghead"><h2 id="log-h">Activity</h2><span class="lbl num" id="log-n"></span></div>
        <ul id="log"></ul>
        <button id="more" type="button" hidden></button>
      </section>
    </div>
  </main>
</div>
<script>
'use strict';
const REFRESH_MS = 45000, PREFETCH_MAX_AGE = 15000, LOG_PAGE = 100;
// Event glyphs in unit coordinates, used by the legend, the tooltip and the activity list.
const GLYPH = {
  dot:     { d: 'M1,0A1,1 0 1,1 -1,0A1,1 0 1,1 1,0Z' },
  square:  { d: 'M-.9,-.9H.9V.9H-.9Z' },
  up:      { d: 'M0,-1.2L1.1,.8L-1.1,.8Z' },
  down:    { d: 'M0,1.2L1.1,-.8L-1.1,-.8Z' },
  diamond: { d: 'M0,-1.25L1.25,0L0,1.25L-1.25,0Z' },
  hollow:  { d: 'M0,-1.25L1.25,0L0,1.25L-1.25,0Z', line: true, open: true },
  ring:    { d: 'M1,0A1,1 0 1,1 -1,0A1,1 0 1,1 1,0Z', line: true, open: true },
  cross:   { d: 'M-1,-1L1,1M1,-1L-1,1', line: true },
  bar:     { d: 'M-1.2,0H1.2', line: true },
};
// tone is the polarity from constants.EventPolarity: pos, neg, neu. A glyph's shape
// names the event and its colour names the polarity; the accent stays with the line.
const EV = {
  WATCH_STREAK:     { label: 'Watch streak', glyph: 'dot',     tone: 'pos' },
  CLAIM:            { label: 'Bonus claim',  glyph: 'dot',     tone: 'pos', scale: .7 },
  RAID:             { label: 'Raid',         glyph: 'square',  tone: 'pos' },
  BET_WIN:          { label: 'Bet won',      glyph: 'up',      tone: 'pos' },
  BET_LOSE:         { label: 'Bet lost',     glyph: 'down',    tone: 'neg' },
  BET_REFUND:       { label: 'Bet refund',   glyph: 'bar',     tone: 'neu' },
  DROP_CLAIM:       { label: 'Drop claim',   glyph: 'diamond', tone: 'pos' },
  MOMENT_CLAIM:     { label: 'Moment claim', glyph: 'hollow',  tone: 'pos' },
  STREAMER_ONLINE:  { label: 'Went online',  glyph: 'ring',    tone: 'pos' },
  STREAMER_OFFLINE: { label: 'Went offline', glyph: 'cross',   tone: 'neg' },
};
const TONE_LABEL = { pos: 'Positive', neg: 'Negative', neu: 'Neutral' };
const TONE_COLOR = { pos: 'up', neg: 'down', neu: 'neu' };
const RANGE_LONG = { '24h': 'in the last 24 hours', '7d': 'in the last 7 days', '30d': 'in the last 30 days', all: 'all time' };
const RANGE_SHORT = { '24h': '24h', '7d': '7d', '30d': '30d', all: 'all time' };
const $ = id => document.getElementById(id);
const root = document.documentElement;
const store = {
  get(k, d) { try { return localStorage.getItem('tcpm.' + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tcpm.' + k, v); } catch {} },
};
function safeHash() { try { return decodeURIComponent(location.hash.slice(1)); } catch { return ''; } }
function safeSet(raw) { try { return new Set(JSON.parse(raw)); } catch { return new Set(); } }
const state = {
  streamers: [], totals: null, sel: safeHash() || store.get('sel', '') || null,
  range: store.get('range', '24h'), sort: store.get('sort', 'points'), q: '',
  hidden: safeSet(store.get('hidden', '[]')),
  data: null, hover: null, logN: LOG_PAGE,
};
if (!RANGE_LONG[state.range]) state.range = '24h';
if (!['points', 'gain', 'name'].includes(state.sort)) state.sort = 'points';

const nf = new Intl.NumberFormat();
const fmt = n => nf.format(n);
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const cls = n => (n > 0 ? 'up' : n < 0 ? 'down' : '');
const dfDay = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
const dfLong = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
const dfTime = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' });
const dfClock = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const dfTip = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
function el(tag, props, ...kids) {
  const e = Object.assign(document.createElement(tag), props || {});
  e.append(...kids);
  return e;
}
function text(node, s) { if (node.textContent !== s) node.textContent = s; }
function tag(type) {
  const k = EV[type], g = GLYPH[k.glyph], s = k.scale || 1;
  const e = el('span', { className: 'tag' });
  const paint = g.line ? 'fill="none" stroke="currentColor" stroke-width=".5" stroke-linecap="round"' : 'fill="currentColor"';
  e.innerHTML = `<svg width="12" height="12" viewBox="-2 -2 4 4" aria-hidden="true" style="color:var(--${TONE_COLOR[k.tone]})"><path transform="scale(${s})" d="${g.d}" ${paint}/></svg>`;
  e.append(k.label);
  return e;
}

/* ---------- theme ---------- */
let C = null;
function colors() {
  if (C) return C;
  const cs = getComputedStyle(root);
  C = { font: '12px ' + cs.getPropertyValue('--mono').trim() };
  for (const k of ['card', 'ink2', 'muted', 'grid', 'hover', 'line', 'wash', 'up', 'down', 'neu']) C[k] = cs.getPropertyValue('--' + k).trim();
  return C;
}
function setTheme(t) {
  root.dataset.theme = t; C = null;
  $('theme').textContent = t === 'dark' ? 'Light theme' : 'Dark theme';
  draw();
}
$('theme').onclick = () => {
  const t = root.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', t); setTheme(t);
};

/* ---------- data ---------- */
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
// Responses are kept per streamer and range, so going back to a view paints at once
// and the network only confirms it. Hovering a row or a range warms the entry.
const cache = new Map();
const key = (name, range) => name + '|' + range;
function load(name, range, maxAge) {
  const k = key(name, range), c = cache.get(k);
  if (c?.p) return c.p;
  if (c?.d && Date.now() - c.at < maxAge) return Promise.resolve(c.d);
  const p = getJSON('api/streamer/' + encodeURIComponent(name) + '?range=' + range).then(d => {
    cache.delete(k); cache.set(k, { d, at: Date.now() });
    if (cache.size > 48) cache.delete(cache.keys().next().value);
    return d;
  }, e => {
    c?.d ? cache.set(k, { d: c.d, at: c.at }) : cache.delete(k);
    throw e;
  });
  cache.set(k, { d: c?.d, at: c?.at || 0, p });
  return p;
}
const warm = (name, range) => { if (name) load(name, range, PREFETCH_MAX_AGE).catch(() => {}); };
async function loadList() {
  const d = await getJSON('api/streamers');
  state.streamers = d.streamers; state.totals = d.totals;
  if (!state.sel || !d.streamers.some(s => s.name === state.sel)) state.sel = sorted()[0]?.name || null;
  renderSide(); renderHead();
}
async function show(maxAge) {
  const name = state.sel, range = state.range;
  if (!name) { setData(null); return; }
  const c = cache.get(key(name, range));
  if (c?.d) setData(c.d); else { renderHead(); $('plot').classList.add('loading'); }
  try {
    const d = await load(name, range, maxAge);
    if (name === state.sel && range === state.range) setData(d);
  } finally {
    if (name === state.sel && range === state.range) $('plot').classList.remove('loading');
  }
}
function setData(d) {
  if (state.data === d) return;
  state.data = d;
  renderHead(); renderLegend(); renderLog(); draw();
}
async function refresh() {
  try {
    // List and chart are fetched together; a stale selection is corrected by the list.
    await Promise.all([loadList(), state.sel ? load(state.sel, state.range, 0).catch(() => {}) : null]);
    await show(REFRESH_MS / 2);
    text($('status'), 'Updated ' + dfClock.format(new Date()));
  } catch {
    text($('status'), 'Connection lost, retrying');
  }
}

/* ---------- sidebar ---------- */
function sorted() {
  const by = { points: (a, b) => b.points - a.points, gain: (a, b) => b.session_gain - a.session_gain, name: () => 0 }[state.sort];
  const q = state.q;
  return state.streamers.filter(s => !q || s.name.includes(q)).sort((a, b) => by(a, b) || a.name.localeCompare(b.name));
}
const list = $('list'), rows = new Map();
const emptyRow = el('li', { className: 'empty' });
function renderSide() {
  const t = state.totals;
  if (t) {
    text($('t-points'), fmt(t.points));
    text($('t-gain'), signed(t.session_gain)); $('t-gain').className = 'num ' + cls(t.session_gain);
    text($('t-online'), t.online + ' of ' + t.count);
  }
  for (const b of document.querySelectorAll('[data-sort]')) b.setAttribute('aria-pressed', b.dataset.sort === state.sort);
  const items = sorted(), gain = state.sort === 'gain';
  let nodes;
  if (!items.length) {
    text(emptyRow, state.streamers.length ? 'No streamer matches' : 'No streamers yet, they appear once the miner has loaded them');

  octx.strokeStyle = c.muted; octx.lineWidth = 1; octx.globalAlpha = .6;
  octx.beginPath(); octx.moveTo(Math.round(px) + .5, y0); octx.lineTo(Math.round(px) + .5, base + LANE_DOWN); octx.stroke();
  octx.globalAlpha = 1;
  if (v !== null) {
    octx.beginPath(); octx.arc(px, Y(v), 4.5, 0, Math.PI * 2);
    octx.fillStyle = c.line; octx.fill(); octx.strokeStyle = c.card; octx.lineWidth = 2; octx.stroke();
  }
  const kids = [el('div', { className: 'v num', textContent: v === null ? 'No data' : fmt(v) })];
  if (sample && sample.prev !== null && sample.prev !== v) {
    kids.push(el('div', null, el('span', { className: 'num ' + cls(v - sample.prev), textContent: signed(v - sample.prev) }), ' vs previous sample'));
  }
  kids.push(el('div', { className: 't num', textContent: dfTip.format(new Date(t)) }));
  for (const e of shown) {
    const head = tag(e.type), msg = eventSentence(e.msg);
    head.append(el('span', { className: 't num', textContent: dfTime.format(new Date(e.t)) }));
    kids.push(el('div', { className: 'e' }, head, ...(msg ? [el('div', { className: 'm', textContent: msg })] : [])));
  }
  if (extra) kids.push(el('div', { className: 'more', textContent: fmt(extra) + (extra === 1 ? ' earlier event' : ' earlier events') + ' in this slot' }));
  tip.replaceChildren(...kids);
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = px + 12; if (left + tw > W - 4) left = px - tw - 12;
  let top = hv.y - th - 12;
  if (top < 4) top = Math.min(H - th - 4, hv.y + 14);
  tip.style.transform = `translate(${Math.round(Math.max(4, left))}px,${Math.round(Math.max(4, top))}px)`;
}
let raf = 0, rafFull = false;
function schedule(full) {
  rafFull = rafFull || full;
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; const f = rafFull; rafFull = false; f ? draw() : drawHover(); });
}
ov.addEventListener('pointermove', e => { const b = ov.getBoundingClientRect(); state.hover = { x: e.clientX - b.left, y: e.clientY - b.top }; schedule(false); });
ov.addEventListener('pointerleave', () => { state.hover = null; schedule(false); });
new ResizeObserver(() => schedule(true)).observe(plot);

/* ---------- boot ---------- */
setTheme(root.dataset.theme);
renderHead();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
