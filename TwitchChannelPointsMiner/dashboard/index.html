<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Points Miner</title>
<style>
:root {
  color-scheme: light;
  --page: #fbfbfa; --ink: #111113; --ink2: #5c5c66; --muted: #9a9aa3;
  --grid: #ececea; --wash: rgba(17,17,19,.055); --tip: #ffffff; --border: rgba(17,17,19,.10);
  --line: #6250d6; --up: #0a7a2f; --down: #c23030; --online: #0ca30c;
  --ev-streak: #eb6834; --ev-claim: #1baf7a; --ev-raid: #2a78d6; --ev-win: #008300;
  --ev-lose: #e34948; --ev-refund: #eda100; --ev-drop: #e87ba4;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0e0e10; --ink: #f1f1f3; --ink2: #a3a3ad; --muted: #6b6b75;
  --grid: #1e1e22; --wash: rgba(255,255,255,.065); --tip: #1a1a1e; --border: rgba(255,255,255,.10);
  --line: #9085e9; --up: #2fbf5b; --down: #f06a6a; --online: #2fbf5b;
  --ev-streak: #e8703f; --ev-claim: #1fb383; --ev-raid: #3987e5; --ev-win: #2fbf5b;
  --ev-lose: #f06a6a; --ev-refund: #d99a16; --ev-drop: #df6a96;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; max-width: 1280px; margin: 0 auto; padding: 28px 32px 24px; gap: 28px; }
header { display: flex; align-items: baseline; gap: 20px; color: var(--ink2); font-size: 13px; }
h1 { font-size: 13px; font-weight: 600; margin: 0; color: var(--ink); }
#summary { margin-right: auto; }
#summary b { color: var(--ink); font-weight: 600; }
.quiet { color: var(--muted); }
.quiet:hover { color: var(--ink); }

main { display: grid; grid-template-columns: 250px 1fr; gap: 48px; min-height: 0; }
.side { display: flex; flex-direction: column; min-height: 0; }
.sorts { display: flex; gap: 12px; padding: 0 10px 10px; font-size: 12px; }
.sorts button { color: var(--muted); }
.sorts button:hover { color: var(--ink2); }
.sorts button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
#list { list-style: none; margin: 0 -2px 0 0; padding: 0 2px 0 0; overflow-y: auto; flex: 1; scrollbar-width: thin; }
#list button { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; color: var(--ink2); }
#list button:hover { background: var(--wash); }
#list button.on { color: var(--ink); }
#list button[aria-current="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.on > .dot, .dot.on { background: var(--online); }
#d-dot:not(.on) { display: none; }
.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.val { font-weight: 400; }

.detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: flex-start; gap: 16px; }
.who { margin-right: auto; min-width: 0; }
.who a { display: inline-flex; align-items: center; gap: 8px; color: var(--ink2); text-decoration: none; font-size: 14px; }
.who a:hover { color: var(--ink); }
#d-points { font-size: 44px; line-height: 1.15; font-weight: 600; letter-spacing: -.025em; margin: 2px 0; }
#d-delta { font-size: 14px; color: var(--ink2); min-height: 20px; }
#d-delta b { font-weight: 600; }
.ranges { display: flex; gap: 2px; }
.ranges button { padding: 4px 10px; border-radius: 7px; color: var(--muted); font-size: 13px; }
.ranges button:hover { color: var(--ink); }
.ranges button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.plot { position: relative; flex: 1; min-height: 260px; margin-top: 20px; transition: opacity .15s; }
.plot.loading { opacity: .5; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#tip { position: absolute; pointer-events: none; z-index: 2; display: none; max-width: 300px; background: var(--tip); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.16); font-size: 12px; }
#tip .v { font-size: 15px; font-weight: 600; }
#tip .t { color: var(--ink2); }
#tip .e { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); }
#tip .e b { display: flex; align-items: center; gap: 6px; font-weight: 600; }
#tip .e i { width: 7px; height: 7px; border-radius: 50%; }
#tip .m { color: var(--ink2); overflow-wrap: anywhere; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; min-height: 22px; margin-top: 10px; font-size: 12px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); }
.legend button:hover { color: var(--ink); }
.legend i { width: 7px; height: 7px; border-radius: 50%; }
.legend em { font-style: normal; color: var(--muted); }
.legend button[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }
.empty { color: var(--muted); padding: 10px; }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; padding: 20px 16px; gap: 20px; }
  header { flex-wrap: wrap; gap: 4px 16px; }
  main { grid-template-columns: 1fr; gap: 24px; }
  .detail { order: -1; }
  #d-points { font-size: 34px; }
  .plot { flex: none; height: 280px; }
  #list { max-height: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Channel Points Miner</h1>
    <span id="summary"></span>
    <span id="status" class="quiet" role="status"></span>
    <button class="quiet" id="theme" type="button">Dark</button>
  </header>
  <main>
    <section class="side" aria-label="Streamers">
      <div class="sorts" role="group" aria-label="Sort streamers">
        <button type="button" data-sort="points">Points</button>
        <button type="button" data-sort="gain">Session gain</button>
        <button type="button" data-sort="name">Name</button>
      </div>
      <ul id="list"><li class="empty">Loading…</li></ul>
    </section>
    <section class="detail" aria-label="Points over time">
      <div class="top">
        <div class="who">
          <a id="d-name" target="_blank" rel="noopener"><span class="dot" id="d-dot"></span><span id="d-label">–</span></a>
          <div id="d-points" class="num">–</div>
          <div id="d-delta"></div>
        </div>
        <div class="ranges" role="group" aria-label="Date range">
          <button type="button" data-range="24h">24h</button>
          <button type="button" data-range="7d">7d</button>
          <button type="button" data-range="30d">30d</button>
          <button type="button" data-range="all">All</button>
        </div>
      </div>
      <div class="plot" id="plot"><canvas id="cv" role="img" aria-label="Channel points over time"></canvas><div id="tip"></div></div>
      <div class="legend" id="legend" aria-label="Event markers (click to show or hide)"></div>
    </section>
  </main>
</div>
<script>
'use strict';
const REFRESH_MS = 30000;
const EV = {
  WATCH_STREAK:     { label: 'Watch streak', color: '--ev-streak', shape: 'circle' },
  CLAIM:            { label: 'Bonus claim',  color: '--ev-claim',  shape: 'circle' },
  RAID:             { label: 'Raid',         color: '--ev-raid',   shape: 'circle' },
  BET_WIN:          { label: 'Bet won',      color: '--ev-win',    shape: 'up' },
  BET_LOSE:         { label: 'Bet lost',     color: '--ev-lose',   shape: 'down' },
  BET_REFUND:       { label: 'Bet refund',   color: '--ev-refund', shape: 'diamond' },
  DROP_CLAIM:       { label: 'Drop claim',   color: '--ev-drop',   shape: 'square' },
  MOMENT_CLAIM:     { label: 'Moment claim', color: '--ev-drop',   shape: 'diamond' },
  STREAMER_ONLINE:  { label: 'Went online',  color: '--ink2',      shape: 'ring' },
  STREAMER_OFFLINE: { label: 'Went offline', color: '--ink2',      shape: 'cross' },
};
const RANGE_LABEL = { '24h': 'in the last 24 hours', '7d': 'in the last 7 days', '30d': 'in the last 30 days', all: 'all time' };
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem('tcpm.' + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tcpm.' + k, v); } catch {} },
};
const state = {
  streamers: [], sel: decodeURIComponent(location.hash.slice(1)) || null,
  range: store.get('range', '24h'), sort: store.get('sort', 'points'),
  hidden: new Set(JSON.parse(store.get('hidden', '[]'))),
  data: null, marks: [], hover: null, seq: 0,
};
const nf = new Intl.NumberFormat();
const fmt = n => nf.format(n);
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const cls = n => (n > 0 ? 'up' : n < 0 ? 'down' : '');
function el(tag, props, ...kids) {
  const e = Object.assign(document.createElement(tag), props || {});
  e.append(...kids);
  return e;
}

/* ---------- theme ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? 'Light' : 'Dark';
  renderLegend(); draw();
}
$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', t); setTheme(t);
};

/* ---------- data ---------- */
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadList() {
  const d = await getJSON('api/streamers'), t = d.totals;
  state.streamers = d.streamers;
  const parts = [el('span', null, el('b', { className: 'num', textContent: fmt(t.points) }), ' points'),
    el('span', null, el('b', { textContent: t.online }), ' of ' + t.count + ' online')];
  if (t.session_gain) parts.push(el('span', null, el('b', { className: 'num ' + cls(t.session_gain), textContent: signed(t.session_gain) }), ' this session'));
  $('summary').replaceChildren(...parts.flatMap((p, i) => i ? ['  ·  ', p] : [p]));
  if (!state.sel || !d.streamers.some(s => s.name === state.sel)) state.sel = sorted()[0]?.name || null;
  renderList(); renderHead();
}
async function loadDetail(keepFrame) {
  if (!state.sel) { state.data = null; draw(); return; }
  const seq = ++state.seq;
  if (!keepFrame) $('plot').classList.add('loading');
  try {
    const d = await getJSON('api/streamer/' + encodeURIComponent(state.sel) + '?range=' + state.range);
    if (seq !== state.seq) return;
    state.data = d;
  } finally {
    if (seq === state.seq) $('plot').classList.remove('loading');
  }
  renderHead(); renderLegend(); draw();
}
async function refresh(keepFrame) {
  try {
    await loadList(); await loadDetail(keepFrame);
    $('status').textContent = '';
  } catch (e) {
    $('status').textContent = 'Connection lost, retrying…';
  }
}

/* ---------- list ---------- */
function sorted() {
  const by = { points: (a, b) => b.points - a.points, gain: (a, b) => b.session_gain - a.session_gain, name: () => 0 }[state.sort];
  return [...state.streamers].sort((a, b) => by(a, b) || a.name.localeCompare(b.name));
}
function renderList() {
  document.querySelectorAll('[data-sort]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sort === state.sort));
  const list = $('list'), top = list.scrollTop, gain = state.sort === 'gain';
  if (!state.streamers.length) { list.replaceChildren(el('li', { className: 'empty', textContent: 'No data yet. Streamers appear once the miner has loaded them.' })); return; }
  list.replaceChildren(...sorted().map(s => {
    const b = el('button', { type: 'button', className: s.online ? 'on' : '', title: s.online ? 'Online' : 'Offline' },
      el('span', { className: 'dot' }),
      el('span', { className: 'nm', textContent: s.name }),
      el('span', { className: 'val num ' + (gain ? cls(s.session_gain) : ''), textContent: gain ? signed(s.session_gain) : fmt(s.points) }));
    b.setAttribute('aria-current', s.name === state.sel);
    b.onclick = () => select(s.name);
    return el('li', null, b);
  }));
  list.scrollTop = top;
}
function select(name) {
  if (name === state.sel) return;
  state.sel = name; state.hover = null;
  history.replaceState(null, '', '#' + encodeURIComponent(name));
  renderList(); renderHead(); loadDetail(false).catch(() => {});
}
document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { state.sort = b.dataset.sort; store.set('sort', state.sort); renderList(); });
document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => {
  state.range = b.dataset.range; store.set('range', state.range); state.hover = null;
  renderHead(); loadDetail(false).catch(() => {});
});

/* ---------- header + legend ---------- */
function renderHead() {
  document.querySelectorAll('[data-range]').forEach(b => b.setAttribute('aria-pressed', b.dataset.range === state.range));
  const s = state.streamers.find(x => x.name === state.sel), d = state.data;
  $('d-label').textContent = s ? s.name + (s.online ? '' : ' · offline') : 'No streamer selected';
  if (s) $('d-name').href = 'https://www.twitch.tv/' + encodeURIComponent(s.name); else $('d-name').removeAttribute('href');
  $('d-dot').className = 'dot' + (s?.online ? ' on' : '');
  $('d-points').textContent = s ? fmt(s.points) : '–';
  const delta = $('d-delta');
  if (s && d && d.name === state.sel && d.range === state.range && d.series.length) {
    delta.replaceChildren(el('b', { className: 'num ' + cls(d.stats.gain), textContent: d.stats.gain ? signed(d.stats.gain) : 'No change' }), ' ' + RANGE_LABEL[d.range]);
  } else delta.replaceChildren();
}
function renderLegend() {
  const counts = {};
  for (const e of state.data?.events || []) counts[e.type] = (counts[e.type] || 0) + 1;
  const css = getComputedStyle(document.documentElement);
  $('legend').replaceChildren(...Object.keys(EV).filter(t => counts[t]).map(t => {
    const dot = el('i'); dot.style.background = css.getPropertyValue(EV[t].color);
    const b = el('button', { type: 'button' }, dot, EV[t].label, el('em', { className: 'num', textContent: fmt(counts[t]) }));
    b.setAttribute('aria-pressed', !state.hidden.has(t));
    b.onclick = () => {
      state.hidden.has(t) ? state.hidden.delete(t) : state.hidden.add(t);
      store.set('hidden', JSON.stringify([...state.hidden])); renderLegend(); draw();
    };
    return b;
  }));
}

/* ---------- chart ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let geo = null;
function niceTicks(lo, hi, n) {
  if (hi <= lo) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let v = a; v <= b + step / 2; v += step) t.push(Math.round(v));
  return t;
}
// Short labels (1.2M, 340k) only when every tick stays exact; otherwise full numbers.
function axisFormat(ticks) {
  const step = ticks[1] - ticks[0], top = Math.max(...ticks.map(Math.abs));
  const unit = top >= 1e6 ? 1e6 : top >= 1e4 ? 1e3 : 1;
  if (unit === 1 || step % (unit / 10)) return fmt;
  return v => +(v / unit).toFixed(1) + (unit === 1e6 ? 'M' : 'k');
}
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const STEPS = [5 * MIN, 15 * MIN, 30 * MIN, HOUR, 2 * HOUR, 3 * HOUR, 6 * HOUR, 12 * HOUR, DAY, 2 * DAY, 7 * DAY, 14 * DAY, 30 * DAY, 90 * DAY, 180 * DAY, 365 * DAY];
function timeTicks(from, to, maxCount) {
  const step = STEPS.find(s => (to - from) / s <= maxCount) || STEPS[STEPS.length - 1];
  const off = new Date(to).getTimezoneOffset() * MIN, t = [];
  for (let v = Math.ceil((from - off) / step) * step + off; v <= to; v += step) t.push(v);
  return { step, t };
}
function timeLabel(t, step) {
  const d = new Date(t);
  const day = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  if (step >= DAY) return day;
  return d.getHours() === 0 && d.getMinutes() === 0 ? day : d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function valueAt(series, t) {
  let lo = 0, hi = series.length - 1;
  if (!series.length || t < series[0][0]) return null;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; series[mid][0] <= t ? lo = mid : hi = mid - 1; }
  return series[lo][1];
}
function shape(kind, x, y, r) {
  ctx.beginPath();
  if (kind === 'up') { ctx.moveTo(x, y - r * 1.2); ctx.lineTo(x + r * 1.1, y + r * .8); ctx.lineTo(x - r * 1.1, y + r * .8); ctx.closePath(); }
  else if (kind === 'down') { ctx.moveTo(x, y + r * 1.2); ctx.lineTo(x + r * 1.1, y - r * .8); ctx.lineTo(x - r * 1.1, y - r * .8); ctx.closePath(); }
  else if (kind === 'diamond') { ctx.moveTo(x, y - r * 1.25); ctx.lineTo(x + r * 1.25, y); ctx.lineTo(x, y + r * 1.25); ctx.lineTo(x - r * 1.25, y); ctx.closePath(); }
  else if (kind === 'square') ctx.rect(x - r * .9, y - r * .9, r * 1.8, r * 1.8);
  else if (kind === 'cross') { ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); }
  else ctx.arc(x, y, r, 0, Math.PI * 2);
}
function draw() {
  const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement), c = n => css.getPropertyValue(n).trim();
  ctx.font = '12px system-ui, -apple-system, "Segoe UI", sans-serif';
  const d = state.data;
  state.marks = []; geo = null;
  if (!d || !d.series.length) {
    ctx.fillStyle = c('--muted'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d ? 'No data in this range yet' : '', w / 2, h / 2);
    $('tip').style.display = 'none';
    return;
  }
  const S = d.series, y0 = 10, y1 = h - 28;
  const pad = Math.max(1, (d.stats.max - d.stats.min) * 0.12);
  const yt = niceTicks(d.stats.min - pad, d.stats.max + pad, 4), yf = axisFormat(yt);
  const lo = yt[0], hi = yt[yt.length - 1];
  const x0 = Math.ceil(Math.max(...yt.map(v => ctx.measureText(yf(v)).width))) + 14, x1 = w - 8;
  const span = Math.max(1, d.to - d.from);
  const X = t => x0 + (t - d.from) / span * (x1 - x0), Y = v => y1 - (v - lo) / (hi - lo) * (y1 - y0);
  geo = { X, Y, x0, x1, y0, y1, d };

  // quiet grid and labels
  ctx.lineWidth = 1; ctx.strokeStyle = c('--grid'); ctx.fillStyle = c('--muted');
  ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
  for (const v of yt) {
    const y = Math.round(Y(v)) + .5;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillText(yf(v), x0 - 14, y);
  }
  const tt = timeTicks(d.from, d.to, Math.max(2, Math.floor((x1 - x0) / 130)));
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  for (const t of tt.t) {
    const x = X(t);
    if (x < x0 + 24 || x > x1 - 24) continue;
    ctx.fillText(timeLabel(t, tt.step), x, y1 + 10);
  }

  // step line: a balance holds until the next sample
  const line = c('--line');
  ctx.beginPath();
  ctx.moveTo(X(S[0][0]), Y(S[0][1]));
  for (let i = 1; i < S.length; i++) { ctx.lineTo(X(S[i][0]), Y(S[i - 1][1])); ctx.lineTo(X(S[i][0]), Y(S[i][1])); }
  ctx.lineTo(x1, Y(S[S.length - 1][1]));
  ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  ctx.lineTo(x1, y1); ctx.lineTo(X(S[0][0]), y1); ctx.closePath();
  const fill = ctx.createLinearGradient(0, y0, 0, y1);
  fill.addColorStop(0, line + '2e'); fill.addColorStop(1, line + '00');
  ctx.fillStyle = fill; ctx.fill();

  // event markers sit on the line
  const shown = d.events.filter(e => EV[e.type] && !state.hidden.has(e.type) && e.t >= d.from);
  const dense = shown.length > 200, r = dense ? 2.25 : 3.5, page = c('--page');
  ctx.lineCap = 'butt';
  for (const e of shown) {
    const m = { x: X(e.t), y: Y(valueAt(S, e.t) ?? S[0][1]), e };
    state.marks.push(m);
    const k = EV[e.type], col = c(k.color);
    shape(k.shape, m.x, m.y, r);
    if (k.shape === 'ring' || k.shape === 'cross') {
      if (k.shape === 'ring') { ctx.fillStyle = page; ctx.fill(); }
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      if (!dense) { ctx.strokeStyle = page; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.fillStyle = col; ctx.fill();
    }
  }
  drawHover(c);
}
function drawHover(c) {
  const tip = $('tip'), hv = state.hover;
  if (!hv || !geo) { tip.style.display = 'none'; return; }
  const { Y, x0, x1, y0, y1, d } = geo;
  let near = null, best = 14 * 14;
  for (const m of state.marks) {
    const q = (m.x - hv.x) ** 2 + (m.y - hv.y) ** 2;
    if (q <= best) { best = q; near = m; }
  }
  const px = near ? near.x : Math.min(x1, Math.max(x0, hv.x));
  const t = near ? near.e.t : d.from + (px - x0) / (x1 - x0) * (d.to - d.from);
  const v = valueAt(d.series, t);
  ctx.strokeStyle = c('--muted'); ctx.lineWidth = 1; ctx.globalAlpha = .5;
  ctx.beginPath(); ctx.moveTo(Math.round(px) + .5, y0); ctx.lineTo(Math.round(px) + .5, y1); ctx.stroke();
  ctx.globalAlpha = 1;
  if (v !== null && !near) {
    ctx.beginPath(); ctx.arc(px, Y(v), 4, 0, Math.PI * 2);
    ctx.fillStyle = c('--line'); ctx.fill(); ctx.strokeStyle = c('--page'); ctx.lineWidth = 2; ctx.stroke();
  }
  const when = new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const rows = [el('div', { className: 'v num', textContent: v === null ? 'No data' : fmt(v) }), el('div', { className: 't', textContent: when })];
  if (near) {
    const k = EV[near.e.type], dot = el('i'); dot.style.background = c(k.color);
    rows.push(el('div', { className: 'e' }, el('b', null, dot, k.label), el('div', { className: 'm', textContent: near.e.msg })));
  }
  tip.replaceChildren(...rows);
  tip.style.display = 'block';
  const box = $('plot').getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = px + 14; if (left + tw > box.width - 4) left = px - tw - 14;
  tip.style.left = Math.max(4, left) + 'px';
  tip.style.top = Math.max(4, Math.min(box.height - th - 4, hv.y - th - 12)) + 'px';
}
let raf = 0;
const redraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
cv.addEventListener('pointermove', e => { const b = cv.getBoundingClientRect(); state.hover = { x: e.clientX - b.left, y: e.clientY - b.top }; redraw(); });
cv.addEventListener('pointerleave', () => { state.hover = null; redraw(); });
new ResizeObserver(redraw).observe($('plot'));

/* ---------- boot ---------- */
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
refresh(false);
setInterval(() => { if (!document.hidden) refresh(true); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
</script>
