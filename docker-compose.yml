services:
  tcpm:
    container_name: TwitchChannelPointsMiner
    # Published by .github/workflows/docker.yml. When using a fork, either
    # replace jadebi with your GitHub account or set TCPM_IMAGE in .env.
    image: ${TCPM_IMAGE:-ghcr.io/jadebi/twitch-channel-points-miner:latest}
    build:
      context: .
      no_cache: false
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # config.json, cookies, logs and the streak cache live in /app/data
      - tcpm-data:/app/data
    environment:
      TCPM_AUTO_UPDATE: false # not really supported for docker containers
      TCPM_USERNAME: ${TCPM_USERNAME:?Enter your Twitch username in .env}
      TCPM_SAVE_LOGS: false
      TCPM_EMOJIS: false
      TCPM_PRIVACY_ANONYMIZE_LOGS: false
      TCPM_SHOW_CLAIMED_BONUS_MSG: true
    # If you dont want to add many variables here
    # you can also use a whole env-file
    # env_file: .env

volumes:
  tcpm-data:
    name: tcpm-twitch-data
