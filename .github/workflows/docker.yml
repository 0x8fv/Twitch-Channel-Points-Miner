name: docker

# Publishes the image to GHCR on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the image for this commit already exists
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/twitch-channel-points-miner"
          sha="$(git rev-parse --short=7 HEAD)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:sha-${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check for an existing image of this commit
        id: existing
        run: |
          if [ "${{ inputs.force }}" != "true" ] && docker manifest inspect "${{ steps.meta.outputs.sha_tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta.outputs.sha_tag }} already exists, nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
